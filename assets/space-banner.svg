<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 320" width="100%" height="100%">
  <defs>
    <!-- Cosmic Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020617" />
      <stop offset="35%" stop-color="#080e28" />
      <stop offset="70%" stop-color="#160830" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>

    <!-- Nebula Radial Glows -->
    <radialGradient id="cyanGlow" cx="20%" cy="35%" r="50%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#0284c7" stop-opacity="0.12" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="purpleGlow" cx="80%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.30" />
      <stop offset="50%" stop-color="#7c3aed" stop-opacity="0.10" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <radialGradient id="centerCore" cx="50%" cy="50%" r="45%">
      <stop offset="0%" stop-color="#1e1b4b" stop-opacity="0.40" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>

    <!-- Text Gradient -->
    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="75%" stop-color="#c084fc" />
      <stop offset="100%" stop-color="#f472b6" />
    </linearGradient>

    <linearGradient id="borderGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#38bdf8" stop-opacity="0.8" />
    </linearGradient>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3.5" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <style>
    .eyebrow { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 11px; font-weight: 700; fill: #38bdf8; letter-spacing: 2.5px; text-transform: uppercase; }
    .main-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 52px; font-weight: 900; letter-spacing: 2px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 400; fill: #94a3b8; letter-spacing: 0.5px; }
    .pill-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; font-weight: 600; fill: #e2e8f0; }
  </style>

  <!-- Deep Cosmic Canvas -->
  <rect width="850" height="320" rx="16" fill="url(#bgGrad)" />
  <rect width="850" height="320" rx="16" fill="url(#cyanGlow)" />
  <rect width="850" height="320" rx="16" fill="url(#purpleGlow)" />
  <rect width="850" height="320" rx="16" fill="url(#centerCore)" />

  <!-- Outer Frame with Cosmic Border -->
  <rect x="1.5" y="1.5" width="847" height="317" rx="15" fill="none" stroke="url(#borderGrad)" stroke-width="1.2" stroke-opacity="0.55" />

  <!-- Constellation Orbit Rays / Tech Lines -->
